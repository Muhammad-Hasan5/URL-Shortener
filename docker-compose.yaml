services:
  migrate:
    env_file:
      - .env
    build:
      context: .
      target: production
    container_name: migrate
    environment:
      PG_PRIMARY_STRING: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@primary:5432/${POSTGRES_DB}
    entrypoint: ["sh", "-c"]
    command:
      - |
        until pg_isready -d "$$PG_PRIMARY_STRING"; do
          echo "Postgres not ready yet, retrying in 2s..."
          sleep 2
        done
        echo "Running migrations..."
        npm run migrate:latest
    depends_on:
      primary:
        condition: service_healthy
    networks:
      - app-network
    restart: "no"

  app1:
    env_file:
      - .env
    build:
      context: .
      target: production
    container_name: app1
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      PG_PRIMARY_STRING: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@primary:5432/${POSTGRES_DB}
      PG_REPLICA_STRING: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@replica:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      primary:
        condition: service_healthy
      replica:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3000/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - app-network
    restart: unless-stopped

  app2:
    env_file:
      - .env
    build:
      context: .
      target: production
    container_name: app2
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      PG_PRIMARY_STRING: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@primary:5432/${POSTGRES_DB}
      PG_REPLICA_STRING: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@replica:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      primary:
        condition: service_healthy
      replica:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  app3:
    env_file:
      - .env
    build:
      context: .
      target: production
    container_name: app3
    ports:
      - "3003:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      PG_PRIMARY_STRING: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@primary:5432/${POSTGRES_DB}
      PG_REPLICA_STRING: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@replica:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      primary:
        condition: service_healthy
      replica:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  haproxy:
    image: haproxy:latest
    container_name: haproxy
    ports:
      - "80:80"
      - "8404:8404"
    volumes:
      - ./HAProxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - app-network
    restart: unless-stopped

  primary:
    image: postgres:16-alpine
    container_name: url_primary
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REPLICA_PASS: ${REPLICA_PASS}
    volumes:
      - primary-data:/var/lib/postgresql/data
      - ./postgres/primary/init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-network
    restart: unless-stopped

  replica:
    image: postgres:16-alpine
    container_name: url_replica
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REPLICA_PASS: ${REPLICA_PASS}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - replica-data:/var/lib/postgresql/data
      - ./postgres/replica/init-replica.sh:/init-replica.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 60s
    entrypoint: >
      bash -c "
        chmod +x /init-replica.sh &&
        /init-replica.sh &&
        docker-entrypoint.sh postgres
      "
    depends_on:
      primary:
        condition: service_healthy
    ports:
      - "5433:5432"
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./src/observability/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - app-network
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-remote-write-receiver"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3004:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PLUGINS_PLUGIN_ADMIN_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - app-network
    depends_on:
      - prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app-network
    volumes:
      - loki_data:/loki

  alloy:
    image: grafana/alloy:latest
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./src/observability/alloy-config.alloy:/etc/alloy/config.alloy
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    networks:
      - app-network
    depends_on:
      - loki

volumes:
  primary-data:
  replica-data:
  redis-data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  app-network:
    driver: bridge