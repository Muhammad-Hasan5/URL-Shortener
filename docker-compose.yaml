services:
  app1:
    build:
      context: .
      target: production
    container_name: app1
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      PG_CONNECTION_STRING: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@primary:5432/${POSTGRES_DB}
      PG_REPLICA_STRING: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@replica:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
    depends_on:
      primary:
        condition: service_healthy
      replica:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  app2:
    build:
      context: .
      target: production
    container_name: app2
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      PG_CONNECTION_STRING: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@primary:5432/${POSTGRES_DB}
      PG_REPLICA_STRING: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@replica:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
    depends_on:
      primary:
        condition: service_healthy
      replica:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  app3:
    build:
      context: .
      target: production
    container_name: app3
    ports:
      - "3003:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      PG_CONNECTION_STRING: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@primary:5432/${POSTGRES_DB}
      PG_REPLICA_STRING: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@replica:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
    depends_on:
      primary:
        condition: service_healthy
      replica:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
  
  haproxy:
    image: haproxy:latest
    container_name: haproxy
    ports:
      - "80:80"
      - "8404:8404"
    volumes:
      - ./HAProxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - app-network
    restart: unless-stopped

  primary:
    image: postgres:16-alpine
    container_name: url_primary
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REPLICA_PASS: ${REPLICA_PASS}
    volumes:
      - primary-data:/var/lib/postgresql/data
      - ./postgres/primary/init-primary.sh:/docker-entrypoint-initdb.d/init-primary.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-network
    restart: unless-stopped

  replica:
    image: postgres:16
    container_name: url_replica
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REPLICA_PASS: ${REPLICA_PASS}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - replica-data:/var/lib/postgresql/data
      - .postgres/replica/init-replica.sh:/init-replica.sh
    entrypoint: >
      bash -c "
        chmod +x /init-replica.sh &&
        /init-replica.sh &&
        docker-entrypoint.sh postgres
      "
    depends_on:
      primary:
        condition: service_healthy    
    ports:
      - "5433:5432"                 
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres-data:
  replica-data:
  redis-data:

networks:
  app-network:
    driver: bridge
