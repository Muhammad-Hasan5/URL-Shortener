global
    log stdout format raw local0

defaults
    log global
    mode http
    timeout client 60s 
    timeout connect 10s
    timeout server 100s   

frontend http80
    bind *:80
    http-request deny if { path_beg /api }
    option forwardfor
    default_backend allservers

backend allservers
    balance roundrobin

    server server1 app1:3000
    server server2 app2:3000
    server server3 app3:3000

listen stats 
    bind *:8404 
    stats enable 
    stats uri /stats 
    stats refresh 10s
    stats auth admin:hasan1122
